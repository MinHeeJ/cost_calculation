spring:
  application:
    name: si-cost
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/sicost}
    username: ${DB_USER:sicost}
    password: ${DB_PASSWORD:dev-only-password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Seoul
  mvc:
    problemdetails:
      enabled: false
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

    get:
      operationId: getCodeGroups
      summary: 그룹 목록
      security: []
      x-related-requirements:
      - REQ-132
      x-source-evidence:
      - SPEC-REQUEST.md — cmn.cd_grp 관련 규칙
      - data-model.md — cmn.cd_grp 필드 계약
      parameters: []
      responses:

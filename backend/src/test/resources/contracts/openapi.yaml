openapi: 3.0.3
info:
  title: SI 프로젝트·원가 관리 기반 HTTP 계약
  version: 0.1.0
  description: BASIC-91 검토된 구현 인계. 무인증 GET3개, MyBatis, 원본 SQL·동일 시드·공통 응답 계약.
security: []
x-handoff-status: ready_for_review
paths:
  /api/menus:
    get:
      operationId: getMenus
      summary: 사용 중 메뉴 트리 조회
      security: []
      x-related-requirements:
      - REQ-074
      - REQ-054
      - REQ-055
      - REQ-057
      - REQ-039
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/MenuNode'
                  required:
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 설정 메뉴 전체 트리
      x-error-policy: 400 입력 오류·500 서버 오류. 404 공통 모델은 components에 보존하지만 빈 collection을
        404로 추정하지 않는다.
      description: 무인증 sys.menu WHERE use_yn=Y, 부모별 sort_seq/menu_id 순 전체 트리. nullable
        icon/screenId와 mobile 변환. data 배열.
      x-business-rules:
      - use_yn=Y만 반환하고 sort_seq 순으로 정렬한다(REQ-074)
      - service DataScope 인자는 현재 ALL이며 역할 seed로 조회를 차단하지 않는다(REQ-039, REQ-002)
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - 메뉴는 전체2단트리·use_yn Y·부모별 sort_seq/menu_id 순. 트리와 health는 비페이지 조회다.
      x-required-tests:
      - 'happy: V1 sys.menu 묶음 10행·화면 31행으로 GET /api/menus 호출 -> menuId/name/screenId/icon/mobile/children
        트리에서 화면 31개 관찰'
      - 'auth: Authorization·세션 없이 메뉴 조회 -> 200; sys.role_menu_auth의 N으로 401/403 생성하지
        않음'
      - 'business: 격리 sys.menu에 use_yn=N 행과 서로 다른 sort_seq 구성 후 조회 -> N 노드 제외 및 Y
        형제 노드 정렬 순서 관찰'
      - 'side-effect: sys.menu 행·감사 필드 스냅샷 후 조회 -> 동일 행·필드 유지 및 service DataScope
        ALL 관찰'
      parameters: []
  /api/month-close:
    get:
      operationId: getMonthClose
      summary: 기간별 월마감 상태 조회
      security: []
      x-related-requirements:
      - REQ-075
      - REQ-022
      - REQ-054
      - REQ-055
      - REQ-057
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/MonthClose'
                  required:
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 요청한 from/to로 한정한 월 상태 배열
      x-error-policy: 400 입력 오류·500 서버 오류. 404 공통 모델은 components에 보존하지만 빈 collection을
        404로 추정하지 않는다.
      description: from/to 필수 YYYY-MM, from<=to; 지정 범위의 모든 월을 반환하고 누락 월은 OPEN. DB
        INSERT 없음. data 배열.
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      x-business-rules:
      - fin.mth_cls.cls_stts_cd로 마감을 판정한다(REQ-022)
      - 미존재 월은 OPEN으로 해석하되 조회로 행을 보충하지 않는다(REQ-075)
      - 마감·해제 및 전월 조정 입력은 이번 명령 범위가 아니다(REQ-001)
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - from/to 필수 YYYY-MM·from<=to; 누락/형식/역전400(field). 조회 중 누락 월 OPEN은 반환만 하며 저장하지
        않는다.
      x-required-tests:
      - 'happy: V2 후 GET /api/month-close?from=2026-09&to=2026-10 호출 -> month=2026-09/status=CLOSED
        및 month=2026-10/status=OPEN 관찰'
      - 'auth: 인증 없이 월마감 조회 -> 200; CLOSED라는 이유로 403 거부하지 않음'
      - 'validation: from=2026-13&to=2026-10 호출 -> 400 및 ApiError.field=from 관찰'
      - 'business: 격리 fixture에 요청 월 fin.mth_cls 행이 없는 상태로 상태 해석 호출 -> OPEN 관찰; HTTP
        배열 확장 assertion은 OQ-003 승인까지 차단'
      - 'side-effect: fin.mth_cls 행·cls_at/rls_at 스냅샷 후 조회 -> 기존 필드 동일 및 누락 월 새 행
        없음 관찰'
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      security: []
      x-related-requirements:
      - REQ-076
      - REQ-054
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:

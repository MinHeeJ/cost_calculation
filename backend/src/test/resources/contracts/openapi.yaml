      - cmn.cd_grp 전체를 use_yn과 무관하게 sort_seq 순으로 조회한다. 그룹명·SYSTEM/BIZ·attr1~3_nm·코드
        전체 건수를 반환한다. 첫 그룹 선택은 UI 소유다.
      x-required-tests:
      - 'happy: 무인증 getCodeGroups 유효 조회 →200 및 정의된 typed data를 ApiResponse에 한 번만 포함.'
      - 'auth: Authorization·쿠키 없이 getCodeGroups 조회 →200·401/403 없음.'
      - 'side-effect: getCodeGroups 전후 대상 테이블과 cmn.cd_hist 스냅샷 비교 →행·감사 필드 모두 불변.'
      - 'business: V1 JOB 선택용 응답 →code_count12·attr1_nm 기본 단가(원); CONTRACT_TYPE →SYSTEM,
        전체 sort_seq 정렬 확인.'
    post:
      operationId: createCodeGroup
      summary: 그룹 추가
      security: []
      x-related-requirements:
      - REQ-111
      - REQ-117
      - REQ-129
      - REQ-143
      - REQ-144

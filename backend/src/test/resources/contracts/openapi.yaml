      parameters: []
      responses:
        '204':
          description: 저장 완료. 응답 본문 없음. 후속 GET으로 커밋 결과를 확인한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          description: 입력 오류. field와 message에 잘못된 필드와 원인을 반환한다.

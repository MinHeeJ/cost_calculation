                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OperatingStandardView'
                  required:
                  - data
        '400':
          description: 입력 오류. field와 message에 잘못된 필드와 원인을 반환한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 지정한 그룹·대응·기준값 또는 요청 월의 적용값 없음. 빈 전체 목록은200이다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/Error500'
      x-pagination:
        paginated: false
        reason: 요청 월에 적용되는 기준값 단일 행.
      x-business-rules:
      - month 필수 YYYY-MM. 지정 키에서 aply_bgn_ym<=month 중 최신 한 행만 반환한다. 현재 달이 아니라 요청 month를 기준으로 한다. 적용 행이 없으면404이며 조회로 행을 만들지 않는다.
      x-required-tests:
      - 'happy: 무인증 getParam 유효 조회 →200 및 정의된 typed data를 ApiResponse에 한 번만 포함.'
      - 'auth: Authorization·쿠키 없이 getParam 조회 →200·401/403 없음.'
      - 'side-effect: getParam 전후 대상 테이블과 cmn.cd_hist 스냅샷 비교 →행·감사 필드 모두 불변.'
      - 'business: VAT_RATE2026-11=11 저장 후 month2026-10 →10, month2026-11 →11; 최신 행이 없는 키/월404.'
      - 'validation: month 누락 또는2026-13 →400 field=month; 요청월을 서버 현재월로 대체하지 않는다.'

                  - data
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 무인증 GET200. data={status:UP}. 세서비스 healthcheck 중 backend 경로.
      x-response-body-status: 'OQ-007: 확인 필요; bodyless/JSON·data 미확정'
      x-required-tests:
      - 'happy: 인증 없는 GET /api/health 정상 호출 -> 200 및 비어 있지 않은 X-Request-Id 관찰'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 단일 health 결과
      parameters: []
      x-business-rules:
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - 메뉴는 전체2단트리·use_yn Y·부모별 sort_seq/menu_id 순. 트리와 health는 비페이지 조회다.

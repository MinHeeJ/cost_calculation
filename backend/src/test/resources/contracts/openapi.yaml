            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 동일 cd_grp_id의 기존 PK와 충돌하여 새 그룹을 만들 수 없다. 기존 그룹과 이력은 변경하지 않는다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeGroupRequest'
      x-no-response-data-reason: spec.md HTTP 계약의 쓰기204 선택. 생성·저장 결과는 후속 조회와 DB/이력으로
        확인하므로 data와 content를 반환하지 않는다.
      x-side-effects:
      - 업무 행과 cmn.cd_hist를 같은 트랜잭션에서 커밋한다. 이력 기록 실패 시 업무 행도 전부 롤백한다.
      - CurrentUser.userId는 NULL이다. 요청으로 처리자 값을 받지 않고 chg_user_id와 해당 테이블의 처리자 필드에
        사용한다.
      x-business-rules:
      - 그룹 코드 대문자·_ 1~30, 이름1~100, attrN_nm 각50 이하를 검증한다. BIZ와 마지막 sort_seq로 INSERT하며
        SYSTEM 유형을 입력받지 않는다.
      - 그룹 추가는 ADD 이력 한 줄이며 cd_grp_id=새 그룹, dtl_cd=NULL이다. 기존 그룹의 코드 행을 복제하지 않는다.
      x-state-transitions:
      - 그룹 없음 + 유효 요청 → BIZ 그룹 마지막 순서 존재 및 ADD/dtl_cd NULL 이력 존재.
      - 검증 실패 또는 이력 INSERT 실패 → 그룹·이력 모두 요청 전 상태.
      x-required-tests:
      - 'happy: 격리 fixture에서 미등록 TEST_GROUP/테스트 그룹을 POST →204·본문0바이트; getCodeGroups에서
        BIZ·마지막 sort_seq 확인.'
      - 'auth: Authorization·쿠키 없이 미등록 TEST_GROUP을 POST →204; 그룹 재조회 존재, 401/403 없음.'
      - 'validation: cd_grp_id=TEST1 또는 그룹명 빈 문자열로 POST →400·해당 ApiError.field; 그룹·이력
        스냅샷 불변.'
      - 'business: 새 그룹 추가 후 DB cd_grp_se_cd와 sort_seq 확인 →BIZ·기존 최대 다음 순서; 기존 그룹/코드
        불변.'
      - 'side-effect: 정상 POST 후 cd_hist 조회 →ADD·새 그룹·dtl_cd NULL·chg_user_id NULL;
        이력 INSERT 실패 주입 후 재시도 →500·그룹/이력 모두 스냅샷 불변.'

x-basic93-review-decisions:
  DEC-PTNR-001: 'MyBatis 유지: 이전 세션의 명시적 사용자 선택과 backend/pom.xml의 실제 MyBatis starter를 따른다. schema.table을 명시한 Mapper
    SQL을 사용하며 JPA/@Table/ddl-auto를 추가하지 않는다. 원문 문장은 출처로 보존한다(REQ-107).'
  DEC-PTNR-002: '사용자 확정: 구분 변경 허용, 기존 연결 유지. 진행 프로젝트나 유효한 소속 인력이 있어도 구분 변경을 허용하며 prj.cust_ptnr_id·mst.dev.vndr_ptnr_id·asgn
    연결은 수정/삭제하지 않는다. 새 구분의 필수 검증과 비해당 필드 NULL 정리만 적용한다. 역할 제거를 이유로 409를 추가하지 않는다(REQ-112, REQ-113, REQ-143, REQ-144).'
  DEC-PTNR-003: 원문 번호 불변·중지 번호 중복 금지를 그대로 적용한다. 잘못된 번호는 중지 후 미사용 올바른 번호로 신규 등록하며 기존 번호의 재할당·정정 예외는 추가하지 않는다. 올바른
    번호가 이미 있으면 그 거래처를 수정/재사용한다. 추정 답변을 사용자 승인으로 기록하지 않는다(REQ-110, REQ-111).
  DEC-PTNR-004: 실제 V1의 ptnr_id는 GENERATED BY DEFAULT AS IDENTITY, ptnr_no는 NOT NULL이며 기본값이 없다. 동일 트랜잭션에서 nextval(pg_get_serial_sequence('mst.ptnr','ptnr_id'))로
    ID를 확보하고 최소3자리 코드와 함께 단일 INSERT한 뒤 INSERT 감사1줄을 저장한다. C-001·C-999·C-1000·C-10000을 보존하며 lpad로 긴 ID를 자르지 않는다.
    DDL/임시번호/NULL 중간 행은 없다. 실패 시 본체·감사를 함께 rollback하고 sequence gap은 허용한다(REQ-106, REQ-116, REQ-138).
  DEC-PTNR-005: '미지정 반복 요청의 구현 기본값: enable은 N→Y일 때만 UPDATE(use_yn) 감사1줄. 이미 Y이면 200으로 현재 상세를 반환하고 updated_at·감사를
    변경하지 않는다. UI CTA는 N에서만 표시한다. 추가 사용자 승인 사실로 기록하지 않는다(REQ-119, REQ-152).'
  DEC-PTNR-006: 실제 PageResult와 맞춰 page=1부터, 기본1, size=20/50/100·기본50으로 정한다. sort는 allowlist 필드와 asc/desc의 쉼표 표현이며
    기본 ptnr_nm,asc, 동률 ptnr_id ASC다. 사용 전체는 useYn=ALL, 생략은 Y. 다건 결과는 disabledIds/disabledCount/inUseCount/alreadyDisabledCount/excluded(id,name,reason,ongoingProjectCount,affiliatedDeveloperCount)이다.
    ids는 입력순 중복 제거, 일부 미존재면 DML 전404. 업무상 제외는 부분 성공200(중복 제거 후 한 건 거래 잔여는409); 기술/감사 실패는 변경 가능한 집합 전체 rollback한다.
    미지정 세부사항의 구현 기본값이며 사용자 승인으로 꾸미지 않는다(REQ-134, REQ-150, REQ-151).

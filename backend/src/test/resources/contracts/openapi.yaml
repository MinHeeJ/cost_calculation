openapi: 3.0.3
info:
  title: SI 프로젝트·원가 관리 — BASIC-93 거래처 변경 계약
  version: 0.1.0
  description: 기존 기반 GET3개 보존 및 거래처9개 추가. MyBatis·V1/V2 보존·BANK V3. 구분 변경 허용, 기존 연결 유지. 명세 검토 결과이며 제품 구현/시험/승인과
    별도.
security: []
x-handoff-status: ready_for_review
paths:
  /api/menus:
    get:
      operationId: getMenus
      summary: 사용 중 메뉴 트리 조회
      security: []
      x-related-requirements:
      - REQ-074
      - REQ-054
      - REQ-055
      - REQ-057
      - REQ-039
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/MenuNode'
                  required:
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 설정 메뉴 전체 트리
      x-error-policy: 400 입력 오류·500 서버 오류. 404 공통 모델은 components에 보존하지만 빈 collection을 404로 추정하지 않는다.
      description: 무인증 sys.menu WHERE use_yn=Y, 부모별 sort_seq/menu_id 순 전체 트리. nullable icon/screenId와 mobile 변환.
        data 배열.
      x-business-rules:
      - use_yn=Y만 반환하고 sort_seq 순으로 정렬한다(REQ-074)
      - service DataScope 인자는 현재 ALL이며 역할 seed로 조회를 차단하지 않는다(REQ-039, REQ-002)
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - 메뉴는 전체2단트리·use_yn Y·부모별 sort_seq/menu_id 순. 트리와 health는 비페이지 조회다.
      x-required-tests:
      - 'happy: V1 sys.menu 묶음 10행·화면 31행으로 GET /api/menus 호출 -> menuId/name/screenId/icon/mobile/children 트리에서
        화면 31개 관찰'
      - 'auth: Authorization·세션 없이 메뉴 조회 -> 200; sys.role_menu_auth의 N으로 401/403 생성하지 않음'
      - 'business: 격리 sys.menu에 use_yn=N 행과 서로 다른 sort_seq 구성 후 조회 -> N 노드 제외 및 Y 형제 노드 정렬 순서 관찰'
      - 'side-effect: sys.menu 행·감사 필드 스냅샷 후 조회 -> 동일 행·필드 유지 및 service DataScope ALL 관찰'
      parameters: []
  /api/month-close:
    get:
      operationId: getMonthClose
      summary: 기간별 월마감 상태 조회
      security: []
      x-related-requirements:
      - REQ-075
      - REQ-022
      - REQ-054
      - REQ-055
      - REQ-057
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/MonthClose'
                  required:
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 요청한 from/to로 한정한 월 상태 배열
      x-error-policy: 400 입력 오류·500 서버 오류. 404 공통 모델은 components에 보존하지만 빈 collection을 404로 추정하지 않는다.
      description: from/to 필수 YYYY-MM, from<=to; 지정 범위의 모든 월을 반환하고 누락 월은 OPEN. DB INSERT 없음. data 배열.
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      x-business-rules:
      - fin.mth_cls.cls_stts_cd로 마감을 판정한다(REQ-022)
      - 미존재 월은 OPEN으로 해석하되 조회로 행을 보충하지 않는다(REQ-075)
      - 마감·해제 및 전월 조정 입력은 이번 명령 범위가 아니다(REQ-001)
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - from/to 필수 YYYY-MM·from<=to; 누락/형식/역전400(field). 조회 중 누락 월 OPEN은 반환만 하며 저장하지 않는다.
      x-required-tests:
      - 'happy: V2 후 GET /api/month-close?from=2026-09&to=2026-10 호출 -> month=2026-09/status=CLOSED 및 month=2026-10/status=OPEN
        관찰'
      - 'auth: 인증 없이 월마감 조회 -> 200; CLOSED라는 이유로 403 거부하지 않음'
      - 'validation: from=2026-13&to=2026-10 호출 -> 400 및 ApiError.field=from 관찰'
      - 'business: 격리 fixture에 요청 월 fin.mth_cls 행이 없는 상태로 상태 해석 호출 -> OPEN 관찰; HTTP 배열 확장 assertion은 OQ-003 승인까지
        차단'
      - 'side-effect: fin.mth_cls 행·cls_at/rls_at 스냅샷 후 조회 -> 기존 필드 동일 및 누락 월 새 행 없음 관찰'
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      security: []
      x-related-requirements:
      - REQ-076
      - REQ-054
      responses:
        '200':
          description: 공통 성공 봉투, data는 아래 결과를 한 번만 포함한다.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Health'
                  required:
                  - data
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 무인증 GET200. data={status:UP}. 세서비스 healthcheck 중 backend 경로.
      x-response-body-status: 'OQ-007: 확인 필요; bodyless/JSON·data 미확정'
      x-required-tests:
      - 'happy: 인증 없는 GET /api/health 정상 호출 -> 200 및 비어 있지 않은 X-Request-Id 관찰'
      x-wire-contract-status: reviewed
      x-pagination:
        paginated: false
        reason: 단일 health 결과
      parameters: []
      x-business-rules:
      - 사용자 선택을 이어 MyBatis·blocking Mapper를 사용하고 sys.menu·fin.mth_cls만 런타임 매핑한다.
      - 공통 성공 {success:true,data:결과,meta:{requestId}}, 실패 {success:false,code,message,field,requestId,meta:{requestId}}.
        X-Request-Id와 일치.
      - 메뉴는 전체2단트리·use_yn Y·부모별 sort_seq/menu_id 순. 트리와 health는 비페이지 조회다.
  /api/partners:
    get:
      operationId: getPartners
      summary: 거래처 조건별 목록 조회
      security: []
      x-related-requirements:
      - REQ-109
      - REQ-114
      - REQ-123
      - REQ-124
      - REQ-130
      - REQ-131
      - REQ-132
      - REQ-134
      - REQ-135
      x-permission-key: UI-15.read
      parameters:
      - name: kind
        in: query
        required: false
        description: 생략은 전체. CUST는 CUST+BOTH, VEND는 VEND+BOTH, BOTH는 BOTH
        schema:
          type: string
          enum:
          - CUST
          - VEND
          - BOTH
      - name: useYn
        in: query
        required: false
        description: 생략 Y, N은 중지, ALL은 사용 여부 조건 제외
        schema:
          type: string
          enum:
          - Y
          - N
          - ALL
          default: Y
      - name: q
        in: query
        required: false
        description: 상호 ILIKE 부분 일치 OR 하이픈 제거 사업자번호 검색. 다른 조건과 AND
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: 1부터 시작
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        description: 거래처 목록 기본 50; 기존 공통 허용 크기20/50/100
        schema:
          type: integer
          enum:
          - 20
          - 50
          - 100
          default: 50
      - name: sort
        in: query
        required: false
        description: 허용된 목록 열명,asc 또는 열명,desc; 동률 ptnr_id ASC. 미지원 필드/방향400 field=sort. 계좌 원문 정렬/SQL 보간 금지. bank_account_display는
          이미 마스킹된 은행명·끝4자리 표현만 정렬하며 계좌 원문으로 정렬하지 않는다.
        schema:
          type: string
          default: ptnr_nm,asc
          enum:
          - ptnr_no,asc
          - ptnr_no,desc
          - ptnr_se_cd,asc
          - ptnr_se_cd,desc
          - ptnr_nm,asc
          - ptnr_nm,desc
          - biz_reg_no,asc
          - biz_reg_no,desc
          - ceo_nm,asc
          - ceo_nm,desc
          - indty_cd,asc
          - indty_cd,desc
          - chrg_nm,asc
          - chrg_nm,desc
          - chrg_tel_no,asc
          - chrg_tel_no,desc
          - use_yn,asc
          - use_yn,desc
          - ongoing_project_count,asc
          - ongoing_project_count,desc
          - current_developer_count,asc
          - current_developer_count,desc
          - txinv_email_addr,asc
          - txinv_email_addr,desc
          - bank_account_display,asc
          - bank_account_display,desc
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '200':
          description: 조건 집합 전체 기준 정렬 후 50건 기본 페이지. 빈 결과 items=[]·total=0도 200
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PartnerPage'
                  required:
                  - data
      x-business-rules:
      - 'REQ-103/REQ-120: 무인증, PermissionService.can=true·DataScope.ALL. UI-15 권한 키는 연결 자리이며 역할 거부/401/403을 만들지
        않는다.'
      - 진행 프로젝트는 PLAN/RUN/HOLD. 현재 투입은 ACTIVE AND bgn_dt<=Asia/Seoul 오늘<=end_dt AND 진행 프로젝트. 어제 철수·END·CANCELLED
        제외.
      - 고객 prj.cust_ptnr_id 집합과 협력 mst.dev.vndr_ptnr_id의 투입 프로젝트 집합을 BOTH에서 합집합 처리하고 프로젝트·dev_id 각각 중복 제거.
      - 목록은 서버에서 은행명 …끝4자리만 투영하며 전체 acntNo·dpstrNm·bankCd를 JSON에 포함하지 않는다. 코드명은 cmn.cd_dtl.cd_nm.
      x-side-effects:
      - 조회 전후 mst.ptnr·관계 테이블·sys.data_chg_hist 불변. 누락을 조회로 INSERT하지 않는다.
      x-state-transitions:
      - 읽기 전용; use_yn·구분·감사 상태 전이 없음.
      x-pagination:
        paginated: true
        page: query.page -> data.page
        size: query.size -> data.size; default 50
        total: data.total
        items: data.items
        decision: page>=1 기본1; size20/50/100 기본50; sort allowlist 기본ptnr_nm,asc; stable ptnr_id ASC
      x-required-tests:
      - 'happy: 사용3·중지1 fixture의 기본 조회 -> 200, data.total=3·상호순; kind=VEND -> VEND/BOTH만'
      - 'auth: 인증 헤더/세션 없는 목록 조회 -> 200·success=true·meta.requestId 존재'
      - 'validation: kind=INVALID 조회 -> 400 ApiError.field=kind·success=false'
      - 'business: 진행2프로젝트·현재6줄5명 및 어제철수/END/CANCELLED 구성 -> 프로젝트2·인력5; BOTH 중복 제거'
      - 'side-effect: 계좌 원문 fixture 조회 -> JSON 전체 계좌 없음·은행명 …끝4자리; DB·감사 동일'
      - 'business: 51행에서 page 생략/size 생략 -> page1 items50 total51; page2 -> items1; page0/허용되지 않은 sort ->400 field'
    post:
      operationId: createPartner
      summary: 거래처 등록
      security: []
      x-related-requirements:
      - REQ-109
      - REQ-111
      - REQ-112
      - REQ-113
      - REQ-116
      - REQ-121
      - REQ-126
      - REQ-137
      - REQ-138
      x-permission-key: UI-15.create
      parameters: []
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '201':
          description: 등록된 구분별 상세
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PartnerDetail'
                  required:
                  - data
        '409':
          description: 사용 중지 거래처 포함 사업자번호 중복; message에 기존 상호. 행·이력 증가 없음
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiError'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - DUPLICATE_BIZ_NO
                  required:
                  - code
      x-business-rules:
      - 'REQ-103/REQ-120: 무인증, PermissionService.can=true·DataScope.ALL. UI-15 권한 키는 연결 자리이며 역할 거부/401/403을 만들지
        않는다.'
      - 구분·상호 누락/공백 또는 길이 초과는 400 field; ptnrNm 50, ceoNm/chrgNm/chrgTelNo 각20, txinvEmailAddr100, dpstrNm30자.
      - CUST/BOTH 이메일 필수·이메일 형식 검증; VEND/BOTH 은행·숫자/하이픈 계좌8~20·예금주 필수. 비해당 필드는 NULL 저장.
      - BANK·INDUSTRY·PARTNER_KIND·JOB 코드명은 기존 cmn.cd_dtl·useCodes external binding을 재사용하며 코드 조회 API를 새로 만들지 않는다.
      - 동일 상호 허용. 잠금/version/If-Match 조건 없음; 마지막 완료 저장이 이긴다.
      - bizRegNo는 숫자10자리 또는 하이픈 형식 입력을 000-00-00000으로 정규화. N 포함 중복 검사; DB unique 충돌도 409 DUPLICATE_BIZ_NO·기존 상호.
      - 'DEC-PTNR-004: 실제 V1의 ptnr_id는 GENERATED BY DEFAULT AS IDENTITY, ptnr_no는 NOT NULL이며 기본값이 없다. 동일 트랜잭션에서
        nextval(pg_get_serial_sequence(''mst.ptnr'',''ptnr_id''))로 ID를 확보하고 최소3자리 코드와 함께 단일 INSERT한 뒤 INSERT 감사1줄을
        저장한다. C-001·C-999·C-1000·C-10000을 보존하며 lpad로 긴 ID를 자르지 않는다. DDL/임시번호/NULL 중간 행은 없다. 실패 시 본체·감사를 함께 rollback하고
        sequence gap은 허용한다(REQ-106, REQ-116, REQ-138).'
      - 실제 V1의 ptnr_id는 GENERATED BY DEFAULT AS IDENTITY, ptnr_no는 NOT NULL이며 기본값이 없다. 동일 트랜잭션에서 nextval(pg_get_serial_sequence('mst.ptnr','ptnr_id'))로
        ID를 확보하고 최소3자리 코드와 함께 단일 INSERT한 뒤 INSERT 감사1줄을 저장한다. C-001·C-999·C-1000·C-10000을 보존하며 lpad로 긴 ID를 자르지 않는다.
        DDL/임시번호/NULL 중간 행은 없다. 실패 시 본체·감사를 함께 rollback하고 sequence gap은 허용한다(REQ-106, REQ-116, REQ-138).
      requestBody:
        required: true
        description: FR-010 입력 및 CMN-702 구분별 필수·bizRegNo 정규화
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateRequest'
      x-side-effects:
      - mst.ptnr 신규1행과 sys.data_chg_hist(tbl_nm='mst.ptnr',obj_rec_id=id,data_chg_ty_cd='INSERT') 정확히1행 동일 트랜잭션.
        감사 실패 시 거래처도 rollback.
      - 성공 후 options의 해당 kind+BOTH 및 사용 목록에서 관찰 가능. 실패는 거래처·이력 불변; 계좌 원문을 INSERT 감사 값/객체 직렬화로 남기지 않는다.
      x-state-transitions:
      - 미존재 -> use_yn=Y; ptnr_no 서버 생성; 기존 거래처 상태는 변경하지 않는다.
      x-required-tests:
      - 'happy: 미등록 숫자10자리·CUST 이메일 등록 -> 201, 상세 Y·정규화 번호·C-코드, options 재조회에 같은 id'
      - 'auth: 인증 없이 유효 등록 -> 201·success=true·meta.requestId, 역할 거부 없음'

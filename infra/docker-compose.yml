services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sicost}
      POSTGRES_USER: ${DB_USER:-sicost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: sicost-backend:1.0.0
    build:
      context: ../backend
    pull_policy: build
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sicost}
      DB_USER: ${DB_USER:-sicost}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  frontend:
    image: sicost-frontend:1.0.0
    build:
      context: ../frontend
    pull_policy: build
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  database:
